name: Tenant branding regression
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test tests/checkout-customer.test.mjs tests/tenant-branding.test.mjs tests/store-domain-metadata.test.mjs tests/alvarez-shipping.test.mjs tests/package-label.test.mjs tests/shipment-discount.test.mjs tests/remittance-checkout.test.mjs tests/remittance-inbox.test.mjs tests/shipping-platform-billing.test.mjs tests/driver-portal.test.mjs tests/admin-nav-accordion.test.mjs tests/shipping-operations-dashboard.test.mjs tests/combo-only-products.test.mjs tests/clover-payments.test.mjs tests/remittance-whatsapp.test.mjs tests/remittance-delivery.test.mjs tests/remittance-database.test.mjs tests/mixed-remittance.test.mjs tests/products-only-operations.test.mjs
